name: Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_migrations:
        description: "Run deploy.php?action=all on the server after deploy"
        type: boolean
        default: false

concurrency:
  group: cpanel-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Notify cPanel webhook
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger cPanel pull deployment webhook
        if: github.event_name == 'push'
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          if [ -n "$DEPLOY_URL" ] && [ -n "$DEPLOY_KEY" ]; then
            curl -fsS --max-time 300 "$DEPLOY_URL?key=$DEPLOY_KEY&action=pull"
          else
            echo "DEPLOY_URL / DEPLOY_KEY not set; skipping webhook."
          fi

      - name: Run migrations on server (manual dispatch only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_migrations }}
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          if [ -n "$DEPLOY_URL" ] && [ -n "$DEPLOY_KEY" ]; then
            curl -fsS --max-time 300 "$DEPLOY_URL?key=$DEPLOY_KEY&action=all"
          else
            echo "DEPLOY_URL / DEPLOY_KEY not set; skipping migrations."
          fi
