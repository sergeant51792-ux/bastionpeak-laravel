version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: bastionpeak-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bastion_peak
      MYSQL_USER: bastion
      MYSQL_PASSWORD: bastion
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: bastionpeak-pma
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_USER: bastion
      PMA_PASSWORD: bastion
    ports:
      - "8080:80"
    depends_on:
      mysql:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit
    container_name: bastionpeak-mail
    restart: unless-stopped
    environment:
      MP_SMTP_BIND_ADDR: 0.0.0.0:1025
      MP_UI_BIND_ADDR: 0.0.0.0:8025
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  mysql_data:
