<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#0A1320">
  <title>Sign in - Bastion Peak</title>
  <meta name="description" content="Sign in to your Bastion Peak account.">
  <link rel="stylesheet" href="app.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:opsz,wght@12..72,400;12..72,500;12..72,600&display=swap" rel="stylesheet">
  <style>
    .auth-error { display: none; }
    .auth-error.visible { display: flex; }
  </style>
</head>
<body>
  <main class="auth-page">
    <div class="auth-box">
      <div class="auth-logo">
        <div class="auth-logo-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2L2 7l10 5 10-5-10-5z"/>
            <path d="M2 17l10 5 10-5"/>
            <path d="M2 12l10 5 10-5"/>
          </svg>
        </div>
        <span class="auth-logo-text">BASTION PEAK</span>
      </div>

      <h1 class="auth-title">Sign in to your account</h1>

      <div id="signin-error" class="auth-error" role="alert" aria-live="polite">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span>Invalid email or password. Please try again.</span>
      </div>

      <form id="signin-form" autocomplete="on" novalidate>
        <div class="auth-field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" placeholder="you@example.com" required>
        </div>

        <div class="auth-field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Enter your password" required>
        </div>

        <div class="auth-actions">
          <button type="submit" class="btn btn-primary btn-block" id="signin-btn">
            <span id="signin-text">Sign in</span>
          </button>
        </div>
      </form>

      <div class="auth-links">
        <a href="#" id="forgot-password">Forgot password</a>
      </div>
    </div>
  </main>

  <script>
    (function() {
      var form = document.getElementById('signin-form');
      var error = document.getElementById('signin-error');
      var btn = document.getElementById('signin-btn');
      var btnText = document.getElementById('signin-text');

      form.addEventListener('submit', function(e) {
        e.preventDefault();
        error.classList.remove('visible');
        var email = document.getElementById('email').value.trim();
        var password = document.getElementById('password').value.trim();
        if (!email || !password) {
          error.querySelector('span').textContent = 'Please enter your email and password.';
          error.classList.add('visible');
          return;
        }
        btnText.textContent = 'Signing in...';
        btn.disabled = true;
        setTimeout(function() {
          btnText.textContent = 'Sign in';
          btn.disabled = false;
          error.querySelector('span').textContent = 'Invalid email or password. Please try again.';
          error.classList.add('visible');
        }, 1200);
      });

      document.getElementById('forgot-password').addEventListener('click', function(e) {
        e.preventDefault();
        var msg = document.createElement('div');
        msg.style.cssText = 'position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.6);z-index:9999;';
        var box = document.createElement('div');
        box.style.cssText = 'background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:32px;max-width:360px;width:90%;text-align:center;';
        box.innerHTML = '<h2 style="font-size:16px;margin-bottom:12px;">Reset your password</h2><p style="font-size:14px;color:var(--text-muted);margin-bottom:20px;">Contact your administrator to reset your password.</p><button class="btn btn-primary" style="width:100%;" onclick="this.closest(\'div[style]\').remove()">Close</button>';
        msg.appendChild(box);
        document.body.appendChild(msg);
      });
    })();
  </script>
</body>
</html>
